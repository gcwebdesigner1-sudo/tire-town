<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 64" role="img" aria-label="Tire Town &amp; Auto Repair logo">
  <title>Tire Town &amp; Auto Repair</title>

  <!-- Icon: orange circle + white 5-spoke wheel -->
  <circle cx="32" cy="32" r="32" fill="#f97316"/>
  <circle cx="32" cy="32" r="24.8" fill="none" stroke="white" stroke-width="5.6"/>
  <g stroke="white" stroke-width="4" stroke-linecap="round">
    <line x1="32"    y1="26.4"  x2="32"    y2="10"/>
    <line x1="37.33" y1="30.27" x2="52.92" y2="25.20"/>
    <line x1="35.29" y1="36.53" x2="44.93" y2="49.80"/>
    <line x1="28.71" y1="36.53" x2="19.07" y2="49.80"/>
    <line x1="26.67" y1="30.27" x2="11.08" y2="25.20"/>
  </g>
  <circle cx="32" cy="32" r="5.6" fill="white"/>

  <!-- Wordmark: "Tire Town" -->
  <text
    x="76" y="30"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="27"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#111827"
  >Tire Town</text>

  <!-- Orange period accent -->
  <text
    x="214" y="30"
    font-family="Georgia, serif"
    font-size="27"
    font-weight="700"
    fill="#f97316"
  >.</text>

  <!-- Subtext: "& Auto Repair" -->
  <text
    x="77" y="50"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="1.5"
    fill="#4b5563"
  >&amp; AUTO REPAIR</text>
</svg>
